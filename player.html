<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Music Player</title>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

  <style>
    body {
      background-color: transparent;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --card-clip: path("M 20 0 H 262 Q 280 0 280 18 V 300 L 260 320 H 18 Q 0 320 0 302 V 20 Z");
      --inner-clip: path("M 19.5 0 H 258.5 Q 278 0 278 17.5 V 298.5 L 258.5 318 H 17.5 Q 0 318 0 300.5 V 19.5 Z");
    }

    .player-border {
      width: 280px;
      height: 320px;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(0, 240, 255, 0.7) 0%,
        rgba(0, 168, 232, 0.3) 25%,
        rgba(255, 255, 255, 0.05) 60%,
        rgba(0, 240, 255, 0.7) 100%
      );
      clip-path: var(--card-clip);
      box-sizing: border-box;
      cursor: grab;
    }

    .player-border:active {
      cursor: grabbing;
    }

    .player-card {
      background-color: rgba(13, 17, 23, 0.8);
      width: 100%;
      height: 100%;
      padding: 16px 18px;
      box-sizing: border-box;
      clip-path: var(--inner-clip);
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #e6edf3;
    }

    .play-icon-small {
      width: 16px;
      height: 16px;
      background-color: #ff2a5f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
    }

    .more-btn {
      color: #8b949e;
      cursor: pointer;
    }

    .more-btn:hover {
      color: #ffffff;
    }

    .menu-popover {
      position: absolute;
      top: 34px;
      right: 18px;
      background-color: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 10;
      flex-direction: column;
      gap: 6px;
    }

    /* An author-stylesheet display value always beats the UA's [hidden]
       rule regardless of specificity, so display:flex has to live here,
       scoped to :not([hidden]), rather than on the bare .menu-popover rule
       above -- otherwise toggling the hidden attribute has no visual effect. */
    .menu-popover:not([hidden]) {
      display: flex;
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 12px;
      color: #e6edf3;
      cursor: pointer;
      white-space: nowrap;
    }

    .lock-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .lock-dot.on {
      background-color: #23a55a;
      border-color: #23a55a;
      box-shadow: 0 0 6px rgba(35, 165, 90, 0.6);
    }

    .menu-row input[type="color"] {
      width: 24px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 2px 0;
    }

    .menu-reset {
      background: none;
      border: none;
      color: #ff2a5f;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      padding: 2px 0;
      text-align: left;
    }

    .menu-reset:hover {
      color: #ffffff;
    }

    .player-border.locked {
      cursor: default;
    }

    .track-info {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .album-art {
      width: 84px;
      height: 84px;
      border-radius: 10px;
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid rgba(255, 42, 95, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff2a5f;
      font-size: 10px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    /* YouTube thumbnails are 4:3 and sometimes have thin letterbox bars baked
       into the image for non-16:9 uploads; a small overscan crops those out
       without meaningfully over-cropping thumbnails that don't have them. */
    .art-fill {
      position: absolute;
      top: -8%;
      left: -8%;
      width: 116%;
      height: 116%;
      background-size: cover;
      background-position: center;
    }

    .details {
      display: flex;
      flex-direction: column;
      width: 100%;
      overflow: hidden;
    }

    .song-title {
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 2px 0;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-name {
      font-size: 13px;
      color: #8b949e;
      margin: 0 0 6px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 20px;
      margin-top: 4px;
    }

    .bar {
      width: 2px;
      background-color: #ff2a5f;
      border-radius: 1px;
      transition: height 0.15s ease;
    }

    .progress-container {
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 7px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 3.5px;
      position: relative;
      margin-bottom: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background-color: #ff2a5f;
      border-radius: 3.5px;
      position: relative;
      pointer-events: none;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -4px;
      top: -2px;
      width: 10px;
      height: 10px;
      background-color: #ff2a5f;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff2a5f;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-family: 'Courier New', Courier, monospace;
      color: #8b949e;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 2px;
    }

    .control-icon {
      color: #8b949e;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-btn {
      color: #ffffff;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .control-icon:hover {
      color: #ffffff;
    }

    .nav-btn:hover {
      opacity: 0.8;
    }

    .control-icon.active {
      color: #ffffff;
    }

    .repeat-wrap {
      position: relative;
      display: inline-flex;
      cursor: pointer;
    }

    .repeat-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ff2a5f;
      color: #ffffff;
      font-size: 7px;
      font-weight: 700;
      line-height: 1;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .repeat-badge:not(.show) {
      display: none;
    }

    .repeat-badge.show {
      display: flex;
    }

    .play-btn-large {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid #ff2a5f;
      box-shadow: 0 0 8px rgba(255, 42, 95, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff2a5f;
      cursor: pointer;
      background: rgba(255, 42, 95, 0.05);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .volume-bar {
      flex-grow: 1;
      height: 7px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 3.5px;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .volume-fill {
      width: 50%;
      height: 100%;
      background-color: #00f0ff;
      border-radius: 3.5px;
      position: relative;
      pointer-events: none;
    }

    .volume-fill::after {
      content: '';
      position: absolute;
      right: -4px;
      top: -2px;
      width: 10px;
      height: 10px;
      background-color: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 6px #00f0ff;
    }

    .icon {
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="player-border">
    <div class="player-card">
      <div class="header">
        <div class="header-title">
          <div class="play-icon-small">
            <svg width="5" height="6" viewBox="0 0 6 8" fill="#000000">
              <polygon points="0,0 6,4 0,8"></polygon>
            </svg>
          </div>
          <span>Now Playing</span>
        </div>
        <div class="more-btn" id="moreBtn">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
        </div>
      </div>

      <div class="menu-popover" id="menuPopover" hidden>
        <div class="menu-row" id="lockRow">
          <span>Lock position</span>
          <div class="lock-dot" id="lockToggle"></div>
        </div>
        <label class="menu-row">
          <span>Background color</span>
          <input type="color" id="bgColorPicker" value="#0d1117">
        </label>
        <div class="menu-divider"></div>
        <button type="button" class="menu-reset" id="resetDefaults">Reset to default</button>
      </div>

      <div class="track-info">
        <div class="album-art" id="albumArt">
          <div class="art-fill" id="artFill"></div>
          <span id="coverText">Cover Art</span>
        </div>
        <div class="details">
          <h3 class="song-title" id="songTitle">Nothing Playing</h3>
          <p class="artist-name" id="artistName">Brave</p>

          <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div>
          </div>
        </div>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-labels">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <svg class="icon control-icon" id="shuffleBtn" width="18" height="18" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        <svg class="icon nav-btn" id="prevBtn" width="20" height="20" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>

        <div class="play-btn-large" id="playBtn">
          <svg class="icon" id="playIcon" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>

        <svg class="icon nav-btn" id="nextBtn" width="20" height="20" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        <div class="repeat-wrap">
          <svg class="icon control-icon" id="repeatBtn" width="18" height="18" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          <span class="repeat-badge" id="repeatBadge">1</span>
        </div>
      </div>

      <div class="volume-container">
        <svg class="icon control-icon" id="muteBtn" width="18" height="18" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path id="volumeWaves" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <div class="volume-bar" id="volumeBar">
          <div class="volume-fill" id="volumeFill"></div>
        </div>
        <svg class="icon control-icon" width="18" height="18" viewBox="0 0 24 24"><path d="M21 15V6"></path><circle cx="18.5" cy="18.5" r="2.5"></circle><path d="M12 12H3"></path><path d="M16 6H3"></path><path d="M12 18H3"></path></svg>
      </div>
    </div>
  </div>

  <script>
    const PLAY_PATH = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
    const PAUSE_PATH = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    const VOLUME_WAVES_D = "M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07";
    const VOLUME_MUTED_D = "M23 9l-6 6M17 9l6 6";

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    let bridge;
    let windowBridge;
    let currentLength = 0;
    let isPlaying = false;
    let lastTitle = null;
    let shuffleActive = false;

    // The last known position/timestamp pair from a real poll, used to
    // interpolate the progress bar smoothly between polls (each poll takes
    // real time due to several sequential playerctl/pactl calls, so drawing
    // only the raw polled value makes the bar visibly lag/jump).
    let lastKnownPosition = 0;
    let lastKnownAt = Date.now();

    function renderProgress(position) {
      if (currentLength > 0) {
        const pct = (position / currentLength) * 100;
        document.getElementById('progressFill').style.width = `${Math.min(pct, 100)}%`;
        document.getElementById('currentTime').textContent = formatTime(position);
        document.getElementById('totalTime').textContent = formatTime(currentLength);
      } else {
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('currentTime').textContent = "0:00";
        document.getElementById('totalTime').textContent = "0:00";
      }
    }

    setInterval(() => {
      if (!isPlaying) return;
      const estimated = lastKnownPosition + (Date.now() - lastKnownAt) / 1000;
      renderProgress(Math.min(estimated, currentLength || estimated));
    }, 200);

    // Animated visualizer effect while playing
    setInterval(() => {
      const bars = document.querySelectorAll('.visualizer .bar');
      bars.forEach(bar => {
        if (isPlaying) {
          const randomHeight = Math.floor(Math.random() * 80) + 20;
          bar.style.height = `${randomHeight}%`;
        } else {
          bar.style.height = '15%';
        }
      });
    }, 200);

    new QWebChannel(qt.webChannelTransport, function(channel) {
      bridge = channel.objects.bridge;
      windowBridge = channel.objects.windowBridge;

      setInterval(() => {
        bridge.get_metadata(function(data) {
          const info = JSON.parse(data);

          document.getElementById('songTitle').textContent = info.title;
          document.getElementById('artistName').textContent = info.artist;
          currentLength = info.length;
          isPlaying = (info.status === 'Playing');

          // Album art: keep showing the last known art through a transient
          // empty poll (same track), but reset to the placeholder as soon as
          // the track itself has changed and no fresh art is available yet.
          const trackChanged = info.title !== lastTitle;
          lastTitle = info.title;

          if (info.art_url) {
            document.getElementById('artFill').style.backgroundImage = `url(${info.art_url})`;
            document.getElementById('coverText').style.display = 'none';
          } else if (info.status === 'Stopped' || info.title === 'Nothing Playing' || trackChanged) {
            document.getElementById('artFill').style.backgroundImage = 'none';
            document.getElementById('coverText').style.display = 'inline';
          }

          // Progress Bar & Timer: resync the interpolation anchor to this
          // fresh, authoritative value, correcting any drift since the last poll.
          lastKnownPosition = info.position;
          lastKnownAt = Date.now();
          renderProgress(info.position);

          // Volume Bar (skip while the user is actively dragging it, so the
          // poll's slightly-stale value doesn't fight the live drag)
          if (info.volume !== undefined && !isDraggingVolume) {
            document.getElementById('volumeFill').style.width = `${Math.min(info.volume * 100, 100)}%`;
          }

          // Mute icon/state
          document.getElementById('volumeWaves').setAttribute('d', info.muted ? VOLUME_MUTED_D : VOLUME_WAVES_D);
          document.getElementById('muteBtn').classList.toggle('active', !!info.muted);

          // Play/Pause Icon state
          const playIcon = document.getElementById('playIcon');
          playIcon.innerHTML = isPlaying ? PAUSE_PATH : PLAY_PATH;

          // Repeat state is reliably reported by playerctl; shuffle is not
          // (this MPRIS source doesn't expose a Shuffle property at all), so
          // shuffle's lit state is driven locally by the click handler instead.
          document.getElementById('repeatBtn').classList.toggle('active', !!info.loop && info.loop !== 'None');
          document.getElementById('repeatBadge').classList.toggle('show', info.loop === 'Track');
        });
      }, 500);
    });

    // Control triggers
    document.getElementById('playBtn').onclick = (e) => { e.stopPropagation(); bridge && bridge.play_pause(); };
    document.getElementById('nextBtn').onclick = (e) => { e.stopPropagation(); bridge && bridge.next_track(); };
    document.getElementById('prevBtn').onclick = (e) => { e.stopPropagation(); bridge && bridge.prev_track(); };
    document.getElementById('shuffleBtn').onclick = (e) => {
      e.stopPropagation();
      shuffleActive = !shuffleActive;
      document.getElementById('shuffleBtn').classList.toggle('active', shuffleActive);
      bridge && bridge.toggle_shuffle();
    };
    document.querySelector('.repeat-wrap').onclick = (e) => { e.stopPropagation(); bridge && bridge.toggle_repeat(); };
    document.getElementById('muteBtn').onclick = (e) => { e.stopPropagation(); bridge && bridge.toggle_mute(); };

    // Seek on progress bar click
    document.getElementById('progressBar').onclick = (e) => {
      e.stopPropagation();
      if (!bridge || currentLength <= 0) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const clickRatio = (e.clientX - rect.left) / rect.width;
      const targetTime = clickRatio * currentLength;
      bridge.set_position(targetTime);
    };

    // Volume bar: click-and-drag, not just a single precise click. The fill
    // updates instantly every event, but the actual bridge.set_volume() call
    // (which spawns a blocking pactl subprocess) is throttled -- mousemove
    // during a real drag can fire 50-100+ times/sec, and calling into the
    // backend on every one of those backs up the main thread enough to delay
    // the metadata polling that drives things like cover art updates.
    let isDraggingVolume = false;
    let lastVolumeRatio = null;
    let lastVolumeSentAt = 0;
    const VOLUME_SEND_INTERVAL_MS = 80;

    function setVolumeFromEvent(e, force) {
      if (!bridge) return;
      const rect = document.getElementById('volumeBar').getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      const vol = Math.max(0, Math.min(1, ratio));
      lastVolumeRatio = vol;
      document.getElementById('volumeFill').style.width = `${vol * 100}%`;

      const now = Date.now();
      if (!force && now - lastVolumeSentAt < VOLUME_SEND_INTERVAL_MS) return;
      lastVolumeSentAt = now;
      bridge.set_volume(vol);
    }

    document.getElementById('volumeBar').addEventListener('mousedown', (e) => {
      e.stopPropagation();
      isDraggingVolume = true;
      setVolumeFromEvent(e, true);
    });

    // Drag the window: handled in JS because Chromium's render surface
    // consumes raw mouse events before they'd ever reach a Python-side
    // widget override, so the window is moved via the WindowBridge instead.
    let isDraggingWindow = false;
    let lastScreenX = 0;
    let lastScreenY = 0;
    // where inside the window the drag started; on Wayland the window stays put
    // during the drag, so drift from this point is exactly how far to move it
    let grabClientX = 0;
    let grabClientY = 0;

    function isInteractiveTarget(el) {
      return !!el.closest(
        '.control-icon, .nav-btn, .play-btn-large, .more-btn, .repeat-wrap, #progressBar, #volumeBar, #menuPopover'
      );
    }

    document.querySelector('.player-border').addEventListener('mousedown', (e) => {
      if (isInteractiveTarget(e.target) || isLocked) return;
      isDraggingWindow = true;
      lastScreenX = e.screenX;
      lastScreenY = e.screenY;
      grabClientX = e.clientX;
      grabClientY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (isDraggingVolume) {
        setVolumeFromEvent(e);
        return;
      }
      if (!isDraggingWindow || !windowBridge) return;
      const dx = e.screenX - lastScreenX;
      const dy = e.screenY - lastScreenY;
      lastScreenX = e.screenX;
      lastScreenY = e.screenY;
      windowBridge.drag(dx, dy, e.clientX - grabClientX, e.clientY - grabClientY);
    });

    document.addEventListener('mouseup', () => {
      if (isDraggingVolume && lastVolumeRatio !== null && bridge) {
        bridge.set_volume(lastVolumeRatio);
      }
      if (isDraggingWindow && windowBridge) windowBridge.drag_end();
      isDraggingWindow = false;
      isDraggingVolume = false;
    });

    // Menu: lock position + background color, persisted per-viewer via localStorage.
    const DEFAULT_BG_COLOR = '#0d1117';
    let isLocked = false;

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyBgColor(hex) {
      document.querySelector('.player-card').style.backgroundColor = hexToRgba(hex, 0.8);
    }

    function applyLocked(locked) {
      isLocked = locked;
      document.getElementById('lockToggle').classList.toggle('on', locked);
      document.querySelector('.player-border').classList.toggle('locked', locked);
    }

    (function loadMenuSettings() {
      try {
        const savedLocked = localStorage.getItem('playerLocked') === '1';
        const savedColor = localStorage.getItem('playerBgColor');
        applyLocked(savedLocked);
        if (savedColor) {
          document.getElementById('bgColorPicker').value = savedColor;
          applyBgColor(savedColor);
        }
      } catch (e) {
        // localStorage can throw in some contexts; fall back to defaults silently.
      }
    })();

    const menuPopover = document.getElementById('menuPopover');

    document.getElementById('moreBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      menuPopover.hidden = !menuPopover.hidden;
    });

    document.addEventListener('click', (e) => {
      if (!menuPopover.hidden && !e.target.closest('#menuPopover, #moreBtn')) {
        menuPopover.hidden = true;
      }
    });

    document.getElementById('lockRow').addEventListener('click', (e) => {
      e.stopPropagation();
      applyLocked(!isLocked);
      try { localStorage.setItem('playerLocked', isLocked ? '1' : '0'); } catch (err) {}
    });

    document.getElementById('bgColorPicker').addEventListener('input', (e) => {
      applyBgColor(e.target.value);
      try { localStorage.setItem('playerBgColor', e.target.value); } catch (err) {}
    });

    document.getElementById('resetDefaults').addEventListener('click', (e) => {
      e.stopPropagation();
      applyLocked(false);
      applyBgColor(DEFAULT_BG_COLOR);
      document.getElementById('bgColorPicker').value = DEFAULT_BG_COLOR;
      try {
        localStorage.removeItem('playerLocked');
        localStorage.removeItem('playerBgColor');
      } catch (err) {}
    });
  </script>
</body>
</html>
